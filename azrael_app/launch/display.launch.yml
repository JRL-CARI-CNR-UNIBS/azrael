%YAML 1.2
---
launch:
  - arg:
      name: rviz_config
      default: "$(find-pkg-share azrael_app)/rviz/setup.rviz"
  - arg:
      name: gripper
      default: "None"
      choice: 
        - value: "None"
        - value: "robotiq-2f-85"
        - value: "robotiq-2f-140"

  - let:
      name: robot_description
      value: "$(command 'xacro $(find-pkg-share azrael_description)/urdf/system.urdf.xacro gripper:=$(var gripper)')"

  - node:
      pkg: robot_state_publisher
      exec: robot_state_publisher
      param:
        - name: robot_description
          value: $(var robot_description)
          type: str

  - node:
      pkg: joint_state_publisher_gui
      exec: joint_state_publisher_gui

  - node:
      pkg: rviz2
      exec: rviz2
      args: "-d $(var rviz_config)"
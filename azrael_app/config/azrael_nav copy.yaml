  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      odom_topic: /azrael/odom
      goal_checker:
        stateful: False
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.09
        yaw_goal_tolerance: 0.09
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56
        model_dt: 0.05
        batch_size: 2000
        vx_std: 0.5
        vx_min: 0.0
        vx_max: 0.3
        wz_std: 0.5
        wz_max: 0.3
        ax_max: 1.0
        az_max: 2.5
        visualize: true
        iteration_count: 1
        prune_distance: 1.0
        transform_tolerance: 0.3
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        critics:
          [
            "ConstraintCritic",
            "CostCritic",
            "GoalCritic",
            "GoalAngleCritic",
            "PathAlignCritic",
            "PathFollowCritic",
            "PathAngleCritic",
            "PreferForwardCritic",
          ]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.5
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.5
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 20.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 3
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0
        CostCritic:
          cost_weight: 10.0

  behavior_server:
    ros__parameters:
      local_costmap_topic:    /azrael/local_costmap/local_costmap/costmap_raw
      local_footprint_topic:  /azrael/local_costmap/local_costmap/published_footprint
      global_costmap_topic:   /azrael/global_costmap/global_costmap/costmap_raw
      global_footprint_topic: /azrael/global_costmap/global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
      spin:
        plugin: "nav2_behaviors/Spin" # In Iron and older versions, "/" was used instead of "::"
      backup:
        plugin: "nav2_behaviors/BackUp" # In Iron and older versions, "/" was used instead of "::"
      drive_on_heading:
        plugin: "nav2_behaviors/DriveOnHeading" # In Iron and older versions, "/" was used instead of "::"
      wait:
        plugin: "nav2_behaviors/Wait" # In Iron and older versions, "/" was used instead of "::"
      assisted_teleop:
        plugin: "nav2_behaviors/AssistedTeleop" # In Iron and older versions, "/" was used instead of "::"
      local_frame: azrael/odom
      global_frame: map
      robot_base_frame: azrael/base_footprint
      transform_timeout: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.08
      # max_rotational_vel: 1.0
      # min_rotational_vel: 0.4
      min_rotational_vel: 0.001
      # rotational_acc_lim: 3.2
      rotational_acc_lim: 0.5

      enable_stamped_cmd_vel: false

  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: True
        waypoint_pause_duration: 0

  # planner_server:
  #   ros__parameters:
  #     expected_planner_frequency: 10.0 # was 1.0
  #     costmap_update_timeout: 2.0
  #     planner_plugins: ['GridBased']
  #     GridBased:
  #       plugin: nav2_navfn_planner/NavfnPlanner # nav2_cooperative_planner/CoopPlanner
  #       tolerance: 0.5
  #       follower_costmap: "/azrael/global_costmap/costmap"
  #       follower_frame: "azrael/base_footprint"
  #       leader_frame: "omron/base_footprint"
  #       use_final_approach_orientation: false
  #       transportation: true
  planner_server:
    ros__parameters:
      planner_plugins: ["GridBased"]
      use_sim_time: True

      GridBased:
        plugin: "nav2_smac_planner/SmacPlannerHybrid"
        tolerance: 0.09                      # tolerance for planning if unable to reach exact pose, in meters
        downsample_costmap: false           # whether or not to downsample the map
        downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
        allow_unknown: false                # allow traveling in unknown space
        max_iterations: 1000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
        max_on_approach_iterations: 1000    # maximum number of iterations to attempt to reach goal once in tolerance
        max_planning_time: 3.5              # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
        motion_model_for_search: "REEDS_SHEPP"    # For Hybrid Dubin, Redds-Shepp
        cost_travel_multiplier: 2.0         # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
        angle_quantization_bins: 64         # For Hybrid nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
        analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
        analytic_expansion_max_length: 3.0    # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting (in meters). This should be scaled with minimum turning radius and be no less than 4-5x the minimum radius
        minimum_turning_radius: 0.08        # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
        reverse_penalty: 1.5                # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
        change_penalty: 0.0                 # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
        non_straight_penalty: 1.20          # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
        cost_penalty: 2.0                   # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
        retrospective_penalty: 0.01        # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not expanded until it is necessary. Must be >= 0.0 and <= 1.0
        rotation_penalty: 100.0               # For Lattice node: Penalty to apply only to pure rotate in place commands when using minimum control sets containing rotate in place primitives. This should always be set sufficiently high to weight against this action unless strictly necessary for obstacle avoidance or there may be frequent discontinuities in the plan where it requests the robot to rotate in place to short-cut an otherwise smooth path for marginal path distance savings.
        lookup_table_size: 20.0               # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
        cache_obstacle_heuristic: True      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.  
        allow_reverse_expansion: False      # For Lattice nodes: Whether to expand state lattice graph in forward primitives or reverse as well, will double the branching factor at each step.   
        smooth_path: True                   # For Lattice/Hybrid nodes: Whether or not to smooth the path, always true for 2D nodes.
        smoother:
          max_iterations: 1000
          w_smooth: 0.3
          w_data: 0.2
          tolerance: 1.0e-10
          do_refinement: true               # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further

  smoother_server:
    ros__parameters:
      costmap_topic:   /azrael/global_costmap/costmap_raw
      footprint_topic: /azrael/global_costmap/published_footprint
      robot_base_frame: azrael/base_footprint
      transform_timeout: 0.2
      smoother_plugins: ["simple_smoother"]
      simple_smoother:
        plugin: "nav2_smoother::SimpleSmoother"
        tolerance: 1.0e-10
        do_refinement: True

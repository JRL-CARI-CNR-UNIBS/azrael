  # TODO: add merged costmap ?
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint_padding: 0.1 #0.03
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        map_topic: /omron/map

        robot_base_frame: azrael/base_footprint
        use_sim_time: False
        #robot_radius: 0.22 # radius set and used, so no footprint points
        footprint: "[[0.68, 0.4],[0.68, -0.4],[-0.68, -0.4],[-0.68, 0.4]]"
        footprint_pad: 0.01
        resolution: 0.05
        plugins: ["static_layer", "inflation_layer"] #, "obstacle_layer", "inflation_layer"] # , "voxel_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          footprint_clearing_enabled: true
          max_obstacle_height: 2.0
          combination_method: 1
          scan:
            topic: /azrael/scan
            obstacle_max_range: 10.0
            obstacle_min_range: 0.0
            raytrace_max_range: 10.0
            raytrace_min_range: -10.0
            max_obstacle_height: 2.0
            min_obstacle_height: -1.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            inf_is_valid: false
        # voxel_layer:
        #   plugin: "nav2_costmap_2d::VoxelLayer"
        #   enabled: True
        #   footprint_clearing_enabled: true
        #   max_obstacle_height: 2.0
        #   publish_voxel_map: True
        #   origin_z: 0.0
        #   z_resolution: 0.05
        #   z_voxels: 16
        #   max_obstacle_height: 2.0
        #   unknown_threshold: 15
        #   mark_threshold: 0
        #   observation_sources: pointcloud
        #   combination_method: 1
        #   pointcloud:  # no frame set, uses frame from message
        #     topic: /intel_realsense_r200_depth/points
        #     max_obstacle_height: 2.0
        #     min_obstacle_height: 0.0
        #     obstacle_max_range: 2.5
        #     obstacle_min_range: 0.0
        #     raytrace_max_range: 3.0
        #     raytrace_min_range: 0.0
        #     clearing: True
        #     marking: True
        #     data_type: "PointCloud2"
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          enabled: true
          subscribe_to_updates: true
          transform_tolerance: 0.1
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          inflation_radius: 2.0
          cost_scaling_factor: 1.3
          inflate_unknown: false
          inflate_around_unknown: true
        always_send_full_costmap: True
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: azrael/odom
        robot_base_frame: azrael/base_footprint
        use_sim_time: False
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05
        plugins: ["obstacle_layer", "inflation_layer"]
        footprint: "[[0.68, 0.4],[0.68, -0.4],[-0.68, -0.4],[-0.68, 0.4]]"
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          footprint_clearing_enabled: true
          max_obstacle_height: 2.0
          combination_method: 1
          scan:
            topic: /azrael/scan
            sensor_frame: azrael/base_footprint
            obstacle_max_range: 1.5
            obstacle_min_range: 0.0
            raytrace_max_range: 1.5
            raytrace_min_range: 0.0
            max_obstacle_height: 2.0
            min_obstacle_height: -1.0
            # clearing: True
            marking: True
            data_type: "LaserScan"
            inf_is_valid: false

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          inflation_radius: 0.8 # 0.55
          cost_scaling_factor: 1.4


gripper_activation_controller:
  ros__parameters:
    type: robotiq_controllers/RobotiqActivationController

gripper_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster
    joints:
      - azrael/robotiq_85_left_knuckle_joint
    interfaces:
      - position

gripper_controller:
  ros__parameters:
    type: position_controllers/GripperActionController # On Humble
    joint: azrael/robotiq_85_left_knuckle_joint
    allow_stalling: true
